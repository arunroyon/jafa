[tox]
env_list = py310, py311, py312
isolated_build = true

[testenv]
extras =
    jwst
    plot
    test
commands =
    pytest {posargs}

[testenv:lint]
extras =
    dev
commands =
    ruff check src tests

[testenv:docs]
extras =
    docs
commands =
    sphinx-build -W -b html docs docs/_build/html

